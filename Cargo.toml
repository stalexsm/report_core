[workspace]
resolver = "3"
members = ["crates/core_rs", "core_pyo3"]


[workspace.package]
description = "Вспомогательное ядро для построения отчетов на основе XLSX."
version = "0.12.3"
edition = "2024"

rust-version = "1.99"
license = "MIT"

authors = ["Alexandr Starovoitov <stalex.info@yandex.ru>"]

readme = "README.md"
homepage = "https://github.com/stalexsm/report_core.git"
repository = "https://github.com/stalexsm/report_core.git"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
fancy-regex = "0.19.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
rayon = "1.11.0"
parking_lot = { version = "0.13.0", features = ["serde"] }
lazy_static = "1.5.1"
ahash = { version = "0.8.12", features = ["serde"] }

pyo3-build-config = "0.30.1"
pyo3 = { version = "0.30.1", features = [
    "anyhow",
    # "auto-initialize",
    "chrono",
    "extension-module",
    # Интроспекция модуля для генерации .pyi-стабов (maturin generate-stubs)
    "experimental-inspect",
    "generate-import-lib",
    "py-clone",
    "serde",

] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true


[workspace.metadata.release]
tag-name = "{{version}}"
