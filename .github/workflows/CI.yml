# Сгенерировано maturin v1.15.0 (`maturin generate-ci github`) и настроено вручную:
#   - триггер — только тег (+ ручной запуск): сборка артефактов и релиз;
#     PR и push в main не гоняются — их закрывает quality.yml;
#   - пути сборки — core_pyo3/ (pyproject.toml лежит там, а не в корне);
#   - статические матрицы (без fromJSON): skylos SKY-D295 требует литеральные
#     раннеры, и статика честнее;
#   - действия запинены на полные SHA (semgrep: mutable action tag);
#   - кэш выключен (skylos SKY-D308: риск отравления кэша в релизном контуре);
#   - у каждой джобы есть timeout-minutes (skylos SKY-D313);
#   - артефакты грузятся строго (if-no-files-found: error, skylos SKY-D311);
#   - тулчейн Rust в macos и windows ставится явно (dtolnay/rust-toolchain):
#     предустановленный rustc на образах раннеров отстаёт от MSRV из Cargo.toml;
#   - публикация — только по тегу, токен — через environment pypi (skylos SKY-D299);
#   - GitHub Release создаётся автоматически с описанием из секции CHANGELOG.md.
#
#    maturin generate-ci github
#
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: musllinux_1_2
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          # x86 и aarch64 отключены: сборка не нужна (см. историю CI.yml).
          # - runner: windows-latest
          #   target: x86
          #   python_arch: x86
          # - runner: windows-11-arm
          #   target: aarch64
          #   python_arch: arm64
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}

      # MSRV из Cargo.toml может быть выше предустановленного на раннере rustc.
      # stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      # MSRV из Cargo.toml может быть выше предустановленного на раннере rustc
      # (macos-15-intel: rustc 1.98.0 при MSRV 1.99 — сборка 0.13.0 упала).
      # stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build sdist
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          command: sdist
          args: --out dist
          working-directory: ./core_pyo3

      - name: Upload sdist
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-sdist
          path: core_pyo3/dist
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Публикация — только по тегу; окружение pypi держит PYPI_API_TOKEN.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    environment: pypi
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Используется для подписи артефактов релиза
      id-token: write
      # Используется для загрузки артефактов релиза
      contents: write
      # Используется для генерации attestations артефактов
      attestations: write
    steps:
      # v6 — checkout нужен ради CHANGELOG.md (источник описания релиза)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131

      - name: Generate artifact attestation
        # v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "wheels-*/*"

      - name: Install uv
        # v7
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Publish to PyPI
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        # Секция тега попадает в CHANGELOG.md ещё на релизном коммите
        # (git-cliff --unreleased --tag X.Y.Z, см. docs/agents/git-workflow.md),
        # поэтому в дереве тега она гарантированно есть.
        # Шаг идёт после публикации: релиз создаётся только при успешной выкатке.
        run: |
          awk -v header="## [${GITHUB_REF_NAME}]" '
            index($0, header) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || {
            echo "Секция ${GITHUB_REF_NAME} не найдена в CHANGELOG.md" >&2
            exit 1
          }
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Релиз ${GITHUB_REF_NAME} уже существует — обновляю описание"
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
