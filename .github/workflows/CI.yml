# Сгенерировано maturin v1.15.0 (`maturin generate-ci github`) и настроено вручную:
#   - пути сборки — core_pyo3/ (pyproject.toml лежит там, а не в корне);
#   - действия запинены на полные SHA (semgrep: mutable action tag);
#   - кэш выключен (skylos SKY-D308: риск отравления кэша в релизном контуре);
#   - у каждой джобы есть timeout-minutes (skylos SKY-D313);
#   - артефакты грузятся строго (if-no-files-found: error, skylos SKY-D311);
#   - публикация — только по тегу, токен — через environment pypi (skylos SKY-D299).
#
#    maturin generate-ci github
#
# Триггеры: PR (проверка сборки), тег (сборка + публикация в PyPI), ручной запуск.
# Push в main не гоняется — коммит уже проверен в PR.
# На PR гоняются только репрезентативные платформы (флаг pr: true);
# полная матрица собирается только по тегу, перед релизом.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Динамическая матрица: в job-level if контекст matrix недоступен,
  # поэтому состав платформ для PR/тега готовит отдельная джоба.
  matrix-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.linux.outputs.matrix }}
      musllinux: ${{ steps.musllinux.outputs.matrix }}
      windows: ${{ steps.windows.outputs.matrix }}
      macos: ${{ steps.macos.outputs.matrix }}
    steps:
      # На PR — только репрезентативные платформы, по тегу — полная матрица.
      - id: linux
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'matrix=[{"runner":"ubuntu-22.04","target":"x86_64"},{"runner":"ubuntu-22.04","target":"x86"},{"runner":"ubuntu-22.04","target":"aarch64"},{"runner":"ubuntu-22.04","target":"armv7"},{"runner":"ubuntu-22.04","target":"s390x"},{"runner":"ubuntu-22.04","target":"ppc64le"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"runner":"ubuntu-22.04","target":"x86_64"}]' >> "$GITHUB_OUTPUT"
          fi

      # musllinux нужен только для релизных артефактов.
      - id: musllinux
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'matrix=[{"runner":"ubuntu-22.04","target":"x86_64"},{"runner":"ubuntu-22.04","target":"x86"},{"runner":"ubuntu-22.04","target":"aarch64"},{"runner":"ubuntu-22.04","target":"armv7"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          fi

      # x86 и aarch64 windows отключены: сборка не нужна (см. историю CI.yml).
      - id: windows
        run: echo 'matrix=[{"runner":"windows-latest","target":"x64","python_arch":"x64"}]' >> "$GITHUB_OUTPUT"

      - id: macos
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'matrix=[{"runner":"macos-15-intel","target":"x86_64"},{"runner":"macos-latest","target":"aarch64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"runner":"macos-latest","target":"aarch64"}]' >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: matrix-prep
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.matrix-prep.outputs.linux) }}
    steps:
      # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  musllinux:
    needs: matrix-prep
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.matrix-prep.outputs.musllinux) }}
    steps:
      # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          manylinux: musllinux_1_2
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  windows:
    needs: matrix-prep
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        # x86 и aarch64 отключены: сборка не нужна (см. историю CI.yml).
        platform: ${{ fromJSON(needs.matrix-prep.outputs.windows) }}
    steps:
      # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  macos:
    needs: matrix-prep
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.matrix-prep.outputs.macos) }}
    steps:
      # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build wheels
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: ./core_pyo3

      - name: Upload wheels
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: core_pyo3/dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build sdist
        # v1
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          command: sdist
          args: --out dist
          working-directory: ./core_pyo3

      - name: Upload sdist
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-sdist
          path: core_pyo3/dist
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Публикация — только по тегу; окружение pypi держит PYPI_API_TOKEN.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    environment: pypi
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Используется для подписи артефактов релиза
      id-token: write
      # Используется для загрузки артефактов релиза
      contents: write
      # Используется для генерации attestations артефактов
      attestations: write
    steps:
      # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131

      - name: Generate artifact attestation
        # v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "wheels-*/*"

      - name: Install uv
        # v7
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Publish to PyPI
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
